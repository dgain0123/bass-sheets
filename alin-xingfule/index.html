<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>幸福了 然後呢 / A-Lin 貝斯譜</title>
<style>
:root{--bg:#fafaf7;--fg:#222;--muted:#666;--line:#ddd;--accent:#2f6f8f}
@media (prefers-color-scheme: dark){:root{--bg:#1c1c1e;--fg:#eee;--muted:#aaa;--line:#444;--accent:#7fb8d6}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0} label{font-size:15px} select{font-size:15px;padding:4px 6px}
.seg button{font-size:15px;padding:5px 12px;border:1px solid var(--accent);background:none;color:var(--accent);cursor:pointer}
#print{font-size:15px;padding:5px 12px;border:0;border-radius:4px;background:var(--accent);color:var(--bg);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--bg)} .note{color:var(--muted);font-size:13px}
iframe{width:100%;height:calc(100vh - 70px);border:0;background:#fff}
</style></head><body>
<header><h1>幸福了 然後呢 / A-Lin</h1>
<label>調：<select id="key"><option value="C">C 大調</option><option value="Db" selected>Db 大調（原調）</option><option value="D">D 大調</option><option value="Eb">Eb 大調</option><option value="E">E 大調</option><option value="F">F 大調</option><option value="F#">F# 大調</option><option value="G">G 大調</option><option value="Ab">Ab 大調</option><option value="A">A 大調</option><option value="Bb">Bb 大調</option><option value="B">B 大調</option></select></label>
<span class="seg" id="style"><button data-s="letter" class="on">英文和弦</button><button data-s="number">數字和弦</button></span>
<span class="seg" id="kind"><button data-s="staff" class="on">Bass 五線譜</button><button data-s="tab">Tab 指板譜</button></span>
<button id="print">列印 PDF</button>
<span id="tip" class="note"></span>
<span class="note">音訊轉譜（自動）；數字和弦 1＝大調主音，轉調不變</span></header>
<iframe id="pdf"></iframe>
<script>
let style="letter",kind="staff";
const key=document.getElementById("key"),pdf=document.getElementById("pdf");
function show(){const k=encodeURIComponent(key.value);pdf.src="pdf/"+k+"_"+style+"_"+kind+".pdf";}
key.onchange=show;
document.getElementById("print").onclick=()=>{try{pdf.contentWindow.focus();pdf.contentWindow.print();}
catch(e){window.open(pdf.src,"_blank");document.getElementById("tip").textContent="已在新分頁開 PDF，按 ⌘P 列印";}};
document.querySelectorAll(".seg").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
if(g.id==="kind")kind=b.dataset.s;else style=b.dataset.s;
g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));show();}));
show();
</script></body></html>
